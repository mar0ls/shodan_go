version: "2"
run:
  timeout: 3m
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - revive
    - unconvert
    - gocritic
    - gosec
    - nolintlint
  settings:
    gosec:
      # G703: path traversal taint — false positive; output path is validated by validateOutPath.
      # G704: SSRF taint — false positive; all requests go to the hardcoded api.shodan.io base URL.
      # G705: XSS taint — false positive for a CLI writing to os.Stdout/bytes.Buffer.
      # G706: log injection — false positive for log.Printf with integer arguments (%d).
      excludes:
        - G703
        - G704
        - G705
        - G706
    revive:
      severity: warning
    gocritic:
      enabled-checks:
        - boolExprSimplify
  exclusions:
    rules:
      - path: "^generated_.*\\.go$"
        linters:
          - all
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
